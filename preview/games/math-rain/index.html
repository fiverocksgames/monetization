<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4a90e2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Math Rain">
    <link rel="manifest" href="manifest.json">
    <title>Math Rain - 수학 빗방울 게임</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-viewport.css">
</head>
<body>
    <div id="app">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <h1>🌧️ Math Rain</h1>
            <p class="subtitle">수학 문제 빗방울 게임</p>

            <div class="setup-container">
                <div class="setup-group">
                    <label>레벨 선택</label>
                    <div class="level-selector">
                        <button class="level-btn" data-level="1">1</button>
                        <button class="level-btn" data-level="2">2</button>
                        <button class="level-btn selected" data-level="3">3</button>
                        <button class="level-btn" data-level="4">4</button>
                        <button class="level-btn" data-level="5">5</button>
                        <button class="level-btn" data-level="6">6</button>
                        <button class="level-btn" data-level="7">7</button>
                        <button class="level-btn" data-level="8">8</button>
                        <button class="level-btn" data-level="9">9</button>
                        <button class="level-btn" data-level="10">10</button>
                    </div>
                    <p class="level-info" id="level-info">레벨 3: 동시 빗방울 3개</p>
                </div>

                <div class="setup-group">
                    <label>연산 선택</label>
                    <div class="btn-group" id="operation-select">
                        <button class="btn-option" data-value="add">➕ 덧셈</button>
                        <button class="btn-option" data-value="sub">➖ 뺄셈</button>
                        <button class="btn-option" data-value="mul">✖️ 곱셈</button>
                        <button class="btn-option" data-value="div">➗ 나눗셈</button>
                        <button class="btn-option selected" data-value="mixed">🔀 혼합</button>
                    </div>
                </div>

                <div class="setup-group">
                    <label>난이도</label>
                    <div class="btn-group" id="difficulty-select">
                        <button class="btn-option" data-value="easy">Easy</button>
                        <button class="btn-option selected" data-value="normal">Normal</button>
                        <button class="btn-option" data-value="hard">Hard</button>
                    </div>
                </div>

                <div class="setup-group">
                    <label>자릿수 선택</label>
                    <div class="btn-group" id="digit-select">
                        <button class="btn-option selected" data-value="1">1자리 + 1자리</button>
                        <button class="btn-option" data-value="2">2자리 + 1자리</button>
                        <button class="btn-option" data-value="3">2자리 + 2자리</button>
                    </div>
                </div>

                <button id="start-game" class="btn-start">게임 시작</button>
                <a class="game-hub-link" href="https://fiverocksgames.github.io/game-hub/">🎮 Game Hub</a>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="game-info">
                    <div class="info-item">
                        <span class="info-label">난이도</span>
                        <span class="info-value" id="difficulty-display">Normal</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">레벨</span>
                        <span class="info-value" id="level-display">1</span>
                    </div>
                    <div class="info-item">
                        <span class="hearts" id="lives-display">❤️❤️❤️</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">점수</span>
                        <span class="info-value" id="score-display">0</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">진행</span>
                        <span class="info-value" id="progress-display">0/10</span>
                    </div>
                </div>
            </div>

            <div class="game-board-container">
                <div class="game-board" id="game-board"></div>
            </div>

            <div class="cards-container" id="cards-container"></div>

            <div class="game-footer">
                <button id="back-to-menu" class="btn-secondary">메뉴로</button>
                <button id="restart-game" class="btn-secondary">다시 시작</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <div class="result-container">
                <h2 id="result-title">🎉 레벨 클리어!</h2>
                <div class="result-stats">
                    <div class="stat-item">
                        <span class="stat-label">최종 점수</span>
                        <span class="stat-value" id="final-score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">도달 레벨</span>
                        <span class="stat-value" id="final-level">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">정확도</span>
                        <span class="stat-value" id="accuracy">0%</span>
                    </div>
                </div>
                <div class="result-buttons">
                    <button id="next-level" class="btn-start">다음 레벨</button>
                    <button id="play-again" class="btn-secondary">같은 레벨</button>
                    <button id="back-to-menu-result" class="btn-secondary">메뉴로</button>
                </div>
            </div>
        </div>
</div>

    <script src="js/game.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
